spring.application.name=usuarios-service
server.port=8081

# MySQL de XAMPP/Laragon (usuario root sin contraseña por defecto).
# La base de datos se crea sola la primera vez.
spring.datasource.url=jdbc:mysql://localhost:3306/pagoflex_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# Crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
